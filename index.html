<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Pride Match</title>
  <style>
    :root{
      --bg:#1b1022;
      --bg2:#2a1535;
      --card:#2f1c3e;
      --text:#fff7ff;
      --muted:#d8bfd8;
      --accent:#ff6bd6;
      --accent2:#7cdbff;
      --like:#44d18d;
      --pass:#ff6b7a;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #3b204d 0%, var(--bg) 55%, #120914 100%);
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .app{
      max-width: 430px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap:12px;
    }

    h1{
      margin:0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .pill{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat{
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 12px;
      text-align:center;
    }

    .stat .num{
      display:block;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .stat .label{
      display:block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .hint{
      text-align:center;
      font-size: 13px;
      color: var(--muted);
      margin-top: -4px;
    }

    .deck{
      position: relative;
      height: 66vh;
      min-height: 420px;
      max-height: 680px;
    }

    .card{
      position:absolute;
      inset: 0;
      border-radius: var(--radius);
      overflow:hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.15)), var(--card);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.08);
      touch-action: pan-y;
      user-select:none;
      -webkit-user-select:none;
      will-change: transform, opacity;
    }

    .card img,
    .badge,
    .glow {
      pointer-events: none;
    }

    .photo-wrap{
      position:relative;
      height: 68%;
      overflow:hidden;
    }

    .photo-wrap img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.02);
    }

    .glow{
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.62) 100%);
    }

    .badge{
      position:absolute;
      top:18px;
      padding:10px 14px;
      border: 3px solid;
      border-radius: 14px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform: uppercase;
      transform: rotate(-12deg);
      opacity:0;
      transition: opacity .12s ease;
      z-index: 3;
    }

    .badge.like{
      right:18px;
      color: var(--like);
      border-color: var(--like);
    }

    .badge.pass{
      left:18px;
      color: var(--pass);
      border-color: var(--pass);
      transform: rotate(12deg);
    }

    .content{
      padding: 14px 16px 16px;
    }

    .name-row{
      display:flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .name{
      font-size: 28px;
      font-weight: 800;
      margin: 0;
    }

    .age{
      color: var(--muted);
      font-size: 18px;
    }

    .meta{
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .actions{
      display:flex;
      gap: 12px;
      justify-content:center;
      margin-top: auto;
      padding-bottom: 8px;
    }

    button{
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 700;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,.12);
    }

    .btn-pass{ background: linear-gradient(135deg, #ff5f75, #ff8b5f); }
    .btn-like{ background: linear-gradient(135deg, #2ed88e, #48c7ff); }
    .btn-reset{ background: rgba(255,255,255,.12); }

    .liked{
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 14px;
    }

    .liked h2{
      margin: 0 0 10px;
      font-size: 18px;
    }

    .liked-list{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .liked-item{
      display:flex;
      align-items:center;
      gap: 10px;
      background: rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 10px;
    }

    .liked-item img{
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .liked-item .txt{
      flex:1;
      min-width:0;
    }

    .liked-item .txt strong{
      display:block;
    }

    .empty{
      color: var(--muted);
      font-size: 14px;
    }

    .chat-modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display:none;
      align-items: flex-end;
      justify-content:center;
      z-index: 999;
    }

    .chat-window{
      width: min(100%, 430px);
      height: 72vh;
      background: #1b1222;
      border-radius: 24px 24px 0 0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .chat-head{
      padding: 14px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: rgba(255,255,255,.04);
    }

    .chat-body{
      flex:1;
      padding: 14px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .msg{
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.08);
    }

    .msg.me{
      margin-left:auto;
      background: linear-gradient(135deg, #ff6bd6, #7cdbff);
      color: #140b1a;
    }

    .chat-input{
      display:flex;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .chat-input input{
      flex:1;
      border: 0;
      border-radius: 999px;
      padding: 12px 14px;
      background: rgba(255,255,255,.08);
      color: white;
      outline: none;
    }

    .chat-input button{
      padding: 12px 16px;
    }

    @media (max-width: 360px){
      h1{ font-size: 24px; }
      .deck{ min-height: 380px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Pride Match</h1>
      <div class="pill">Swipe to match</div>
    </div>

    <div class="stats">
      <div class="stat"><span class="num" id="likesCount">0</span><span class="label">Likes</span></div>
      <div class="stat"><span class="num" id="passesCount">0</span><span class="label">Passes</span></div>
      <div class="stat"><span class="num" id="matchesCount">0</span><span class="label">Matches</span></div>
    </div>

    <div class="hint">Swipe right to like. Left to pass.</div>

    <div class="deck">
      <div class="card" id="card"></div>
    </div>

    <div class="actions">
      <button class="btn-pass" id="passBtn">Pass</button>
      <button class="btn-like" id="likeBtn">Like</button>
      <button class="btn-reset" id="resetDeckBtn">Reset</button>
    </div>

    <div class="liked">
      <h2>Liked profiles</h2>
      <div class="liked-list" id="likedList"></div>
    </div>
  </div>

  <div class="chat-modal" id="chatModal">
    <div class="chat-window">
      <div class="chat-head">
        <strong id="chatTitle">Chat</strong>
        <button id="closeChatBtn">Close</button>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-input">
        <input id="chatInput" type="text" placeholder="Type a message..." />
        <button id="sendChatBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "pride-match-state-v4";
    const LIKED_KEY = "pride-match-liked-v2";

    const defaultProfiles = [
      { id: 1, name: "Alex", age: 29, pronouns: "she/her", bio: "Coffee enthusiast, amateur climber, and terrible at baking.", photo: "" },
      { id: 2, name: "Jordan", age: 27, pronouns: "they/them", bio: "Museum dates, record stores, and making playlists for strangers.", photo: "" },
      { id: 3, name: "Mina", age: 31, pronouns: "she/they", bio: "Bookstore regular, late-night walker, and brunch critic.", photo: "" },
      { id: 4, name: "Sam", age: 26, pronouns: "he/they", bio: "Dog person, movie marathoner, and very into good ramen.", photo: "" }
    ];

    const els = {
      card: document.getElementById("card"),
      likesCount: document.getElementById("likesCount"),
      passesCount: document.getElementById("passesCount"),
      matchesCount: document.getElementById("matchesCount"),
      likedList: document.getElementById("likedList"),
      passBtn: document.getElementById("passBtn"),
      likeBtn: document.getElementById("likeBtn"),
      resetDeckBtn: document.getElementById("resetDeckBtn"),
      chatModal: document.getElementById("chatModal"),
      chatTitle: document.getElementById("chatTitle"),
      chatBody: document.getElementById("chatBody"),
      chatInput: document.getElementById("chatInput"),
      sendChatBtn: document.getElementById("sendChatBtn"),
      closeChatBtn: document.getElementById("closeChatBtn"),
    };

    let state = loadState();
    let likedProfiles = loadLiked();
    let drag = { active: false, startX: 0, currentX: 0, id: null };
    let activeChat = null;

    function loadState(){
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
          index: 0, likes: 0, passes: 0, matches: 0, profiles: defaultProfiles
        };
      } catch {
        return { index: 0, likes: 0, passes: 0, matches: 0, profiles: defaultProfiles };
      }
    }

    function loadLiked(){
      try {
        return JSON.parse(localStorage.getItem(LIKED_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorage.setItem(LIKED_KEY, JSON.stringify(likedProfiles));
    }

    function resetCardStyles() {
      els.card.style.transition = "none";
      els.card.style.transform = "translateX(0) rotate(0deg)";
      els.card.style.opacity = "1";
      requestAnimationFrame(() => {
        els.card.style.transition = "";
      });
    }

    function currentProfile(){
      return state.profiles[state.index % state.profiles.length];
    }

    function fallbackPhoto(profile){
      const colors = ["#ff6bd6", "#7cdbff", "#44d18d", "#ffb86b"];
      const c = colors[(profile.id - 1) % colors.length];
      const letter = profile.name.charAt(0).toUpperCase();
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${c}"/>
              <stop offset="100%" stop-color="#2a1535"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
                font-family="Arial, sans-serif" font-size="220" font-weight="700" fill="white">${letter}</text>
        </svg>
      `)}`;
    }

    function renderCard(){
      const p = currentProfile();
      els.card.innerHTML = `
        <div class="photo-wrap">
          <img src="${p.photo || fallbackPhoto(p)}" alt="${p.name}">
          <div class="glow"></div>
          <div class="badge like">LIKE</div>
          <div class="badge pass">PASS</div>
        </div>
        <div class="content">
          <div class="name-row">
            <h2 class="name">${p.name}</h2>
            <div class="age">${p.age}</div>
          </div>
          <div class="meta">${p.pronouns} • ${p.bio}</div>
        </div>
      `;
      resetCardStyles();
      renderLiked();
      updateStats();
      attachSwipe();
    }

    function updateStats(){
      els.likesCount.textContent = state.likes;
      els.passesCount.textContent = state.passes;
      els.matchesCount.textContent = state.matches;
    }

    function renderLiked(){
      if (!likedProfiles.length) {
        els.likedList.innerHTML = `<div class="empty">No likes yet.</div>`;
        return;
      }
      els.likedList.innerHTML = likedProfiles.map(p => `
        <div class="liked-item">
          <img src="${p.photo || fallbackPhoto(p)}" alt="${p.name}">
          <div class="txt">
            <strong>${p.name}, ${p.age}</strong>
            <div>${p.pronouns}</div>
          </div>
          <button data-chat="${p.id}">Chat</button>
        </div>
      `).join("");

      els.likedList.querySelectorAll("[data-chat]").forEach(btn => {
        btn.addEventListener("click", () => openChat(Number(btn.dataset.chat)));
      });
    }

    function showBadge(type){
      const badge = els.card.querySelector(`.badge.${type}`);
      if (!badge) return;
      badge.style.opacity = "1";
      setTimeout(() => badge.style.opacity = "0", 120);
    }

    function advanceProfile(){
      state.index++;
      saveState();
      renderCard();
    }

    function applyDecision(type){
      if (type === "like") {
        state.likes++;
        const p = currentProfile();
        if (!likedProfiles.some(x => x.id === p.id)) likedProfiles.unshift(p);
        if (state.likes % 2 === 0) state.matches++;
        showBadge("like");
      } else {
        state.passes++;
        showBadge("pass");
      }
      saveState();

      els.card.style.transition = "transform .18s ease, opacity .18s ease";
      els.card.style.transform = type === "like"
        ? "translateX(120%) rotate(18deg)"
        : "translateX(-120%) rotate(-18deg)";
      els.card.style.opacity = "0.35";

      setTimeout(() => {
        advanceProfile();
      }, 180);
    }

    function attachSwipe(){
      let startX = 0;
      let dragging = false;

      const onDown = (e) => {
        dragging = true;
        startX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
        els.card.style.transition = "none";
      };

      const onMove = (e) => {
        if (!dragging) return;
        const x = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
        const dx = x - startX;
        const rotate = dx / 16;
        els.card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
        const like = els.card.querySelector(".badge.like");
        const pass = els.card.querySelector(".badge.pass");
        if (dx > 20) {
          like.style.opacity = Math.min(1, dx / 100);
          pass.style.opacity = 0;
        } else if (dx < -20) {
          pass.style.opacity = Math.min(1, Math.abs(dx) / 100);
          like.style.opacity = 0;
        } else {
          like.style.opacity = 0;
          pass.style.opacity = 0;
        }
      };

      const onUp = (e) => {
        if (!dragging) return;
        dragging = false;
        const x = e.clientX ?? e.changedTouches?.[0]?.clientX ?? 0;
        const dx = x - startX;

        if (dx > 90) {
          applyDecision("like");
          return;
        }
        if (dx < -90) {
          applyDecision("pass");
          return;
        }

        els.card.style.transition = "transform .18s ease";
        resetCardStyles();
      };

      els.card.onpointerdown = (e) => { e.preventDefault(); onDown(e); };
      window.onpointermove = onMove;
      window.onpointerup = onUp;

      els.card.ontouchstart = (e) => { onDown(e); };
      els.card.ontouchmove = onMove;
      els.card.ontouchend = onUp;
    }

    function openChat(id){
      const p = likedProfiles.find(x => x.id === id);
      if (!p) return;
      activeChat = p;
      els.chatTitle.textContent = `Chat with ${p.name}`;
      els.chatBody.innerHTML = `
        <div class="msg">Hey! It's ${p.name}. Say hi 👋</div>
      `;
      els.chatModal.style.display = "flex";
      els.chatInput.value = "";
      els.chatInput.focus();
    }

    function closeChat(){
      els.chatModal.style.display = "none";
      activeChat = null;
    }

    function sendChat(){
      const text = els.chatInput.value.trim();
      if (!text || !activeChat) return;
      const div = document.createElement("div");
      div.className = "msg me";
      div.textContent = text;
      els.chatBody.appendChild(div);
      els.chatInput.value = "";
      els.chatBody.scrollTop = els.chatBody.scrollHeight;
    }

    els.passBtn.addEventListener("click", () => applyDecision("pass"));
    els.likeBtn.addEventListener("click", () => applyDecision("like"));
    els.resetDeckBtn.addEventListener("click", () => {
      state.index = 0;
      state.likes = 0;
      state.passes = 0;
      state.matches = 0;
      likedProfiles = [];
      saveState();
      renderCard();
    });

    els.closeChatBtn.addEventListener("click", closeChat);
    els.chatModal.addEventListener("click", (e) => {
      if (e.target === els.chatModal) closeChat();
    });
    els.sendChatBtn.addEventListener("click", sendChat);
    els.chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });

    renderCard();
  </script>
</body>
</html>
