<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Pride Match</title>
  <style>
    :root{
      --bg:#140d1c;
      --panel:#21132d;
      --panel2:#2c183c;
      --text:#fff7ff;
      --muted:#d8bfd8;
      --accent:#ff6bd6;
      --accent2:#7cdbff;
      --like:#44d18d;
      --pass:#ff6b7a;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #3b204d 0%, var(--bg) 55%, #0e0812 100%);
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .app{
      max-width: 430px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap:12px;
    }

    h1{
      margin:0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .pill{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      font-size: 13px;
      white-space: nowrap;
    }

    .screen{
      display:none;
      flex-direction:column;
      gap:14px;
      flex:1;
    }

    .screen.active{ display:flex; }

    .stats{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat{
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 12px;
      text-align:center;
    }

    .stat .num{
      display:block;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .stat .label{
      display:block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .hint{
      text-align:center;
      font-size: 13px;
      color: var(--muted);
      margin-top: -4px;
    }

    .deck{
      position: relative;
      height: 66vh;
      min-height: 420px;
      max-height: 680px;
    }

    .card{
      position:absolute;
      inset: 0;
      border-radius: var(--radius);
      overflow:hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.15)), var(--panel2);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.08);
      touch-action: pan-y;
      user-select:none;
      -webkit-user-select:none;
      will-change: transform, opacity;
    }

    .card img, .badge, .glow { pointer-events:none; }

    .photo-wrap{ position:relative; height: 68%; overflow:hidden; }
    .photo-wrap img{ width:100%; height:100%; object-fit: cover; display:block; transform: scale(1.02); }

    .glow{
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.62) 100%);
    }

    .badge{
      position:absolute;
      top:18px;
      padding:10px 14px;
      border: 3px solid;
      border-radius: 14px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform: uppercase;
      transform: rotate(-12deg);
      opacity:0;
      transition: opacity .12s ease;
      z-index: 3;
    }

    .badge.like{ right:18px; color: var(--like); border-color: var(--like); }
    .badge.pass{ left:18px; color: var(--pass); border-color: var(--pass); transform: rotate(12deg); }

    .content{ padding: 14px 16px 16px; }
    .name-row{ display:flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .name{ font-size: 28px; font-weight: 800; margin: 0; }
    .age{ color: var(--muted); font-size: 18px; }
    .meta{ margin-top: 6px; color: var(--muted); font-size: 14px; line-height: 1.45; }

    .actions{
      display:flex;
      gap: 12px;
      justify-content:center;
      margin-top: auto;
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    button{
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 700;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,.12);
    }

    .btn-pass{ background: linear-gradient(135deg, #ff5f75, #ff8b5f); }
    .btn-like{ background: linear-gradient(135deg, #2ed88e, #48c7ff); }
    .btn-reset{ background: rgba(255,255,255,.12); }
    .btn-edit{ background: linear-gradient(135deg, #a86bff, #ff6bd6); }

    .liked, .editor, .messages{
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 14px;
    }

    .section-title{
      margin: 0 0 10px;
      font-size: 18px;
    }

    .liked-list, .message-list{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .liked-item, .message-item{
      display:flex;
      align-items:center;
      gap: 10px;
      background: rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 10px;
    }

    .liked-item img{
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .liked-item .txt{
      flex:1;
      min-width:0;
    }

    .liked-item .txt strong{ display:block; }

    .empty{
      color: var(--muted);
      font-size: 14px;
    }

    .nav{
      display:flex;
      gap:10px;
      justify-content: space-between;
    }

    .nav button{
      flex:1;
    }

    .chat-modal, .edit-modal, .match-modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display:none;
      align-items: center;
      justify-content:center;
      z-index: 999;
      padding: 16px;
    }

    .chat-window, .edit-window, .match-window{
      width: min(100%, 430px);
      background: #1b1222;
      border-radius: 24px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.08);
    }

    .chat-window{
      height: 72vh;
      display:flex;
      flex-direction:column;
    }

    .chat-head, .edit-head, .match-head{
      padding: 14px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: rgba(255,255,255,.04);
    }

    .chat-body{
      flex:1;
      padding: 14px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .msg{
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.08);
    }

    .msg.me{
      margin-left:auto;
      background: linear-gradient(135deg, #ff6bd6, #7cdbff);
      color: #140b1a;
    }

    .chat-input{
      display:flex;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .chat-input input, .editor input, .editor textarea{
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255,255,255,.08);
      color: white;
      outline: none;
    }

    .editor .field{
      display:flex;
      flex-direction:column;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .editor textarea{
      min-height: 90px;
      resize: vertical;
    }

    .editor .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .match-window{
      text-align:center;
      padding: 18px;
      transform: scale(.9);
      animation: pop .22s ease forwards;
    }

    @keyframes pop{
      to { transform: scale(1); }
    }

    .match-window h3{
      margin: 0 0 8px;
      font-size: 24px;
    }

    .match-window p{
      color: var(--muted);
      margin: 0;
    }

    .match-actions{
      display:flex;
      gap: 10px;
      justify-content:center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Pride Match</h1>
      <div class="pill">Swipe to match</div>
    </div>

    <div id="homeScreen" class="screen active">
      <div class="stats">
        <div class="stat"><span class="num" id="likesCount">0</span><span class="label">Likes</span></div>
        <div class="stat"><span class="num" id="passesCount">0</span><span class="label">Passes</span></div>
        <div class="stat"><span class="num" id="matchesCount">0</span><span class="label">Matches</span></div>
      </div>

      <div class="hint">Swipe right to like. Left to pass.</div>

      <div class="deck">
        <div class="card" id="card"></div>
      </div>

      <div class="actions">
        <button class="btn-pass" id="passBtn">Pass</button>
        <button class="btn-like" id="likeBtn">Like</button>
        <button class="btn-edit" id="editBtn">Edit</button>
        <button class="btn-reset" id="resetDeckBtn">Reset</button>
        <button class="btn-reset" id="messagesBtn">Chats</button>
      </div>
    </div>

    <div id="likesScreen" class="screen">
      <div class="liked">
        <h2 class="section-title">Liked profiles</h2>
        <div class="liked-list" id="likedList"></div>
      </div>
      <div class="nav">
        <button class="btn-reset" id="backHomeBtn">Back</button>
      </div>
    </div>

    <div id="messagesScreen" class="screen">
      <div class="messages">
        <h2 class="section-title">Chats</h2>
        <div class="message-list" id="messageList"></div>
      </div>
      <div class="nav">
        <button class="btn-reset" id="backHomeBtn2">Back</button>
      </div>
    </div>

    <div class="editor">
      <h2 class="section-title">Profile editor</h2>
      <div class="field"><label>Name</label><input id="editName" /></div>
      <div class="row">
        <div class="field"><label>Age</label><input id="editAge" type="number" /></div>
        <div class="field"><label>Pronouns</label><input id="editPronouns" /></div>
      </div>
      <div class="field"><label>Bio</label><textarea id="editBio"></textarea></div>
      <div class="field"><label>Photo upload</label><input id="editPhoto" type="file" accept="image/*" /></div>
      <div class="actions">
        <button class="btn-like" id="saveProfileBtn">Save Profile</button>
      </div>
    </div>
  </div>

  <div class="chat-modal" id="chatModal">
    <div class="chat-window">
      <div class="chat-head">
        <strong id="chatTitle">Chat</strong>
        <button id="closeChatBtn">Close</button>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-input">
        <input id="chatInput" type="text" placeholder="Type a message..." />
        <button id="sendChatBtn">Send</button>
      </div>
    </div>
  </div>

  <div class="match-modal" id="matchModal">
    <div class="match-window">
      <h3>It's a match! 💖</h3>
      <p id="matchText">You matched with someone new.</p>
      <div class="match-actions">
        <button id="matchChatBtn" class="btn-like">Say hi</button>
        <button id="matchCloseBtn" class="btn-reset">Close</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "pride-match-state-v4";
    const LIKED_KEY = "pride-match-liked-v2";
    const CHAT_KEY = "pride-match-chat-v1";

    const defaultProfiles = [
      { id: 1, name: "Alex", age: 29, pronouns: "she/her", bio: "Coffee enthusiast, amateur climber, and terrible at baking.", photo: "" },
      { id: 2, name: "Jordan", age: 27, pronouns: "they/them", bio: "Museum dates, record stores, and making playlists for strangers.", photo: "" },
      { id: 3, name: "Mina", age: 31, pronouns: "she/they", bio: "Bookstore regular, late-night walker, and brunch critic.", photo: "" },
      { id: 4, name: "Sam", age: 26, pronouns: "he/they", bio: "Dog person, movie marathoner, and very into good ramen.", photo: "" }
    ];

    const els = {
      homeScreen: document.getElementById("homeScreen"),
      likesScreen: document.getElementById("likesScreen"),
      messagesScreen: document.getElementById("messagesScreen"),
      card: document.getElementById("card"),
      likesCount: document.getElementById("likesCount"),
      passesCount: document.getElementById("passesCount"),
      matchesCount: document.getElementById("matchesCount"),
      likedList: document.getElementById("likedList"),
      messageList: document.getElementById("messageList"),
      passBtn: document.getElementById("passBtn"),
      likeBtn: document.getElementById("likeBtn"),
      editBtn: document.getElementById("editBtn"),
      resetDeckBtn: document.getElementById("resetDeckBtn"),
      messagesBtn: document.getElementById("messagesBtn"),
      backHomeBtn: document.getElementById("backHomeBtn"),
      backHomeBtn2: document.getElementById("backHomeBtn2"),
      editName: document.getElementById("editName"),
      editAge: document.getElementById("editAge"),
      editPronouns: document.getElementById("editPronouns"),
      editBio: document.getElementById("editBio"),
      editPhoto: document.getElementById("editPhoto"),
      saveProfileBtn: document.getElementById("saveProfileBtn"),
      chatModal: document.getElementById("chatModal"),
      chatTitle: document.getElementById("chatTitle"),
      chatBody: document.getElementById("chatBody"),
      chatInput: document.getElementById("chatInput"),
      sendChatBtn: document.getElementById("sendChatBtn"),
      closeChatBtn: document.getElementById("closeChatBtn"),
      matchModal: document.getElementById("matchModal"),
      matchText: document.getElementById("matchText"),
      matchChatBtn: document.getElementById("matchChatBtn"),
      matchCloseBtn: document.getElementById("matchCloseBtn"),
    };

    let state = loadState();
    let likedProfiles = loadLiked();
    let chats = loadChats();
    let activeChat = null;
    let dragStartX = 0;
    let dragging = false;

    function loadState(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { index: 0, likes: 0, passes: 0, matches: 0, profiles: defaultProfiles }; } catch { return { index: 0, likes: 0, passes: 0, matches: 0, profiles: defaultProfiles }; } }
    function loadLiked(){ try { return JSON.parse(localStorage.getItem(LIKED_KEY)) || []; } catch { return []; } }
    function loadChats(){ try { return JSON.parse(localStorage.getItem(CHAT_KEY)) || {}; } catch { return {}; } }
    function saveAll(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(LIKED_KEY, JSON.stringify(likedProfiles)); localStorage.setItem(CHAT_KEY, JSON.stringify(chats)); }

    function fallbackPhoto(profile){
      const colors = ["#ff6bd6", "#7cdbff", "#44d18d", "#ffb86b"];
      const c = colors[(profile.id - 1) % colors.length];
      const letter = profile.name.charAt(0).toUpperCase();
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${c}"/>
              <stop offset="100%" stop-color="#2a1535"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
                font-family="Arial, sans-serif" font-size="220" font-weight="700" fill="white">${letter}</text>
        </svg>
      `)}`;
    }

    function currentProfile(){ return state.profiles[state.index % state.profiles.length]; }
    function updateStats(){ els.likesCount.textContent = state.likes; els.passesCount.textContent = state.passes; els.matchesCount.textContent = state.matches; }

    function renderLiked(){
      if (!likedProfiles.length) return els.likedList.innerHTML = `<div class="empty">No likes yet.</div>`;
      els.likedList.innerHTML = likedProfiles.map(p => `
        <div class="liked-item">
          <img src="${p.photo || fallbackPhoto(p)}" alt="${p.name}">
          <div class="txt">
            <strong>${p.name}, ${p.age}</strong>
            <div>${p.pronouns}</div>
          </div>
          <button class="chat-btn" data-id="${p.id}">Chat</button>
        </div>
      `).join("");
      document.querySelectorAll(".chat-btn").forEach(btn => btn.addEventListener("click", () => openChat(Number(btn.dataset.id))));
    }

    function renderMessages(){
      const ids = Object.keys(chats);
      if (!ids.length) return els.messageList.innerHTML = `<div class="empty">No chats yet.</div>`;
      els.messageList.innerHTML = ids.map(id => {
        const p = likedProfiles.find(x => x.id === Number(id)) || currentProfile();
        const last = chats[id][chats[id].length - 1];
        return `
          <div class="liked-item">
            <img src="${p.photo || fallbackPhoto(p)}" alt="${p.name}">
            <div class="txt">
              <strong>${p.name}</strong>
              <div>${last ? last.text : "No messages yet"}</div>
            </div>
            <button class="chat-btn" data-id="${id}">Open</button>
          </div>
        `;
      }).join("");
      document.querySelectorAll(".chat-btn").forEach(btn => btn.addEventListener("click", () => openChat(Number(btn.dataset.id))));
    }

    function resetCardStyles(){
      els.card.style.transition = "none";
      els.card.style.transform = "translateX(0) rotate(0deg)";
      els.card.style.opacity = "1";
      requestAnimationFrame(() => { els.card.style.transition = ""; });
    }

    function renderCard(){
      const p = currentProfile();
      els.card.innerHTML = `
        <div class="photo-wrap">
          <img src="${p.photo || fallbackPhoto(p)}" alt="${p.name}">
          <div class="glow"></div>
          <div class="badge like">LIKE</div>
          <div class="badge pass">PASS</div>
        </div>
        <div class="content">
          <div class="name-row">
            <h2 class="name">${p.name}</h2>
            <div class="age">${p.age}</div>
          </div>
          <div class="meta">${p.pronouns} • ${p.bio}</div>
        </div>
      `;
      resetCardStyles();
      updateStats();
      renderLiked();
      renderMessages();
      fillEditor(p);
      attachSwipe();
    }

    function openMatch(profile){
      els.matchText.textContent = `You matched with ${profile.name}!`;
      els.matchModal.style.display = "flex";
      els.matchChatBtn.onclick = () => { closeMatch(); openChat(profile.id); };
    }
    function closeMatch(){ els.matchModal.style.display = "none"; }

    function advanceProfile(){ state.index++; saveAll(); renderCard(); }

    function applyDecision(type){
      const p = currentProfile();
      if (type === "like") {
        state.likes++;
        if (!likedProfiles.some(x => x.id === p.id)) likedProfiles.unshift(p);
        state.matches = Math.floor(state.likes / 2);
        chats[p.id] = chats[p.id] || [{ from: "them", text: `Hey! ${p.name} liked you back 💖` }];
        showBadge("like");
        if (state.likes % 2 === 0) setTimeout(() => openMatch(p), 220);
      } else {
        state.passes++;
        showBadge("pass");
      }
      saveAll();
      updateStats();
      renderLiked();
      renderMessages();
      els.card.style.transition = "transform .18s ease, opacity .18s ease";
      els.card.style.transform = type === "like" ? "translateX(120%) rotate(18deg)" : "translateX(-120%) rotate(-18deg)";
      els.card.style.opacity = "0.35";
      setTimeout(advanceProfile, 180);
    }

    function showBadge(type){
      const badge = els.card.querySelector(`.badge.${type}`);
      if (!badge) return;
      badge.style.opacity = "1";
      setTimeout(() => badge.style.opacity = "0", 120);
    }

    function attachSwipe(){
      els.card.onpointerdown = (e) => {
        dragging = true;
        dragStartX = e.clientX;
        els.card.style.transition = "none";
        els.card.setPointerCapture?.(e.pointerId);
      };
      els.card.onpointermove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - dragStartX;
        const rotate = dx / 16;
        els.card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
        const like = els.card.querySelector(".badge.like");
        const pass = els.card.querySelector(".badge.pass");
        if (dx > 20) { like.style.opacity = Math.min(1, dx / 100); pass.style.opacity = 0; }
        else if (dx < -20) { pass.style.opacity = Math.min(1, Math.abs(dx) / 100); like.style.opacity = 0; }
        else { like.style.opacity = 0; pass.style.opacity = 0; }
      };
      els.card.onpointerup = (e) => {
        if (!dragging) return;
        dragging = false;
        const dx = e.clientX - dragStartX;
        if (dx > 90) return applyDecision("like");
        if (dx < -90) return applyDecision("pass");
        resetCardStyles();
      };
      els.card.onpointercancel = () => { dragging = false; resetCardStyles(); };
    }

    function fillEditor(p){
      els.editName.value = p.name;
      els.editAge.value = p.age;
      els.editPronouns.value = p.pronouns;
      els.editBio.value = p.bio;
      els.editPhoto.value = "";
    }

    function saveEditor(){
      const p = currentProfile();
      p.name = els.editName.value.trim() || p.name;
      p.age = Number(els.editAge.value) || p.age;
      p.pronouns = els.editPronouns.value.trim() || p.pronouns;
      p.bio = els.editBio.value.trim() || p.bio;
      saveAll();
      renderCard();
    }

    function openChat(id){
      const p = likedProfiles.find(x => x.id === id) || state.profiles.find(x => x.id === id);
      if (!p) return;
      activeChat = p;
      els.chatTitle.textContent = `Chat with ${p.name}`;
      const thread = chats[p.id] || [];
      els.chatBody.innerHTML = thread.map(m => `<div class="msg ${m.from === "me" ? "me" : ""}">${m.text}</div>`).join("");
      if (!thread.length) els.chatBody.innerHTML = `<div class="msg">Hey! It's ${p.name}. Say hi 👋</div>`;
      els.chatModal.style.display = "flex";
      els.chatInput.value = "";
      els.chatBody.scrollTop = els.chatBody.scrollHeight;
    }

    function closeChat(){ els.chatModal.style.display = "none"; activeChat = null; }
    function sendChat(){
      const text = els.chatInput.value.trim();
      if (!text || !activeChat) return;
      chats[activeChat.id] = chats[activeChat.id] || [];
      chats[activeChat.id].push({ from: "me", text });
      saveAll();
      const div = document.createElement("div");
      div.className = "msg me";
      div.textContent = text;
      els.chatBody.appendChild(div);
      els.chatBody.scrollTop = els.chatBody.scrollHeight;
      els.chatInput.value = "";
      setTimeout(() => {
        const replies = ["Cute.", "I like that.", "Tell me more ✨", "Haha, agreed.", "You have great taste."];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        chats[activeChat.id].push({ from: "them", text: reply });
        saveAll();
        if (els.chatModal.style.display === "flex" && activeChat && activeChat.id) {
          const r = document.createElement("div");
          r.className = "msg";
          r.textContent = reply;
          els.chatBody.appendChild(r);
          els.chatBody.scrollTop = els.chatBody.scrollHeight;
        }
        renderMessages();
      }, 800);
    }

    function showScreen(which){
      [els.homeScreen, els.likesScreen, els.messagesScreen].forEach(s => s.classList.remove("active"));
      which.classList.add("active");
    }

    els.passBtn.addEventListener("click", () => applyDecision("pass"));
    els.likeBtn.addEventListener("click", () => applyDecision("like"));
    els.resetDeckBtn.addEventListener("click", () => { state.index = 0; state.likes = 0; state.passes = 0; state.matches = 0; likedProfiles = []; chats = {}; saveAll(); renderCard(); });
    els.editBtn.addEventListener("click", () => fillEditor(currentProfile()));
    els.saveProfileBtn.addEventListener("click", saveEditor);
    els.editPhoto.addEventListener("change", () => {
      const file = els.editPhoto.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { currentProfile().photo = reader.result; saveAll(); renderCard(); };
      reader.readAsDataURL(file);
    });

    els.messagesBtn.addEventListener("click", () => { renderMessages(); showScreen(els.messagesScreen); });
    els.backHomeBtn.addEventListener("click", () => showScreen(els.homeScreen));
    els.backHomeBtn2.addEventListener("click", () => showScreen(els.homeScreen));

    els.closeChatBtn.addEventListener("click", closeChat);
    els.chatModal.addEventListener("click", (e) => { if (e.target === els.chatModal) closeChat(); });
    els.sendChatBtn.addEventListener("click", sendChat);
    els.chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

    els.matchCloseBtn.addEventListener("click", closeMatch);
    els.matchModal.addEventListener("click", (e) => { if (e.target === els.matchModal) closeMatch(); });

    renderCard();
  </script>
</body>
</html>
