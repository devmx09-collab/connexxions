<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pride Match</title>
  <style>
    :root{
      --bg:#121014;
      --card:#1c1722;
      --card-2:#241c22;
      --text:#f7ecff;
      --muted:#bdaec9;
      --accent:#ff4fa3;
      --accent-2:#8b5cf6;
      --pass:#ff5b6e;
      --good:#53ffa5;
      --shadow:0 20px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,79,163,.18), transparent 30%),
        radial-gradient(circle at bottom, rgba(139,92,246,.15), transparent 30%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:16px;
    }
    .app{
      width:min(420px, 100%);
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .topbar, .card, .controls, .panel, .chatbox{
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.06);
      box-shadow:var(--shadow);
      border-radius:24px;
      backdrop-filter: blur(16px);
    }
    .topbar{
      padding:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .stats{
      display:flex;
      gap:8px;
      width:100%;
    }
    .stat{
      flex:1;
      background:rgba(255,255,255,.04);
      border-radius:16px;
      padding:10px;
      text-align:center;
    }
    .stat .num{font-size:20px;font-weight:800}
    .stat .label{font-size:12px;color:var(--muted)}
    .card{
      position:relative;
      overflow:hidden;
      min-height:480px;
      padding:18px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }
    .photo{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:96px;
      font-weight:900;
      background:linear-gradient(135deg, rgba(255,79,163,.24), rgba(139,92,246,.24));
    }
    .meta{
      position:relative;
      z-index:2;
      width:100%;
      padding:16px;
      border-radius:20px;
      background:linear-gradient(180deg, transparent, rgba(0,0,0,.55));
    }
    .meta h2, .meta p{margin:0}
    .meta p{color:var(--muted)}
    .empty{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      background:rgba(0,0,0,.25);
      z-index:3;
    }
    .controls{
      display:flex;
      gap:12px;
      padding:14px;
    }
    button{
      border:0;
      color:white;
      font-weight:700;
      border-radius:18px;
      padding:14px 18px;
      cursor:pointer;
    }
    .pass{
      background:linear-gradient(135deg, #7c2740, var(--pass));
      flex:1;
    }
    .like{
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      flex:1;
    }
    .ghost-btn{
      background:rgba(255,255,255,.08);
      color:var(--text);
      width:100%;
    }
    .panel{
      padding:16px;
      display:none;
      gap:10px;
    }
    .panel.show{display:grid}
    .panel input{
      width:100%;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:var(--text);
    }
    .chatbox{
      display:none;
      padding:16px;
    }
    .chatbox.show{display:block}
    .small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div style="font-weight:800">Pride Match</div>
      <button class="ghost-btn" id="editBtn" style="width:auto;padding:10px 14px;">Edit Profile</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="likesCount">0</div><div class="label">Likes</div></div>
      <div class="stat"><div class="num" id="passesCount">0</div><div class="label">Passes</div></div>
      <div class="stat"><div class="num" id="matchesCount">0</div><div class="label">Matches</div></div>
    </div>

    <div class="card" id="mainCard">
      <div class="empty" id="emptyState">
        <div>
          <h2>No more profiles</h2>
          <p>Add your own profile or refresh later for more matches.</p>
          <button class="like" id="addProfileBtn">Add Profile</button>
          <button class="pass" id="resetDeckBtn" style="margin-top:10px;">Reset Deck</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="pass" id="passBtn">Pass</button>
      <button class="like" id="likeBtn">Like</button>
    </div>

    <div class="panel" id="profileEditor">
      <input id="nameInput" placeholder="Your name" />
      <input id="ageInput" type="number" placeholder="Age" />
      <input id="pronounsInput" placeholder="Pronouns" />
      <button class="like" id="saveProfileBtn">Save Profile</button>
    </div>

    <div class="chatbox" id="chatBox">
      <div style="font-weight:700;margin-bottom:8px;">Match Chat</div>
      <div class="small">Say hello to your new match.</div>
    </div>
  </div>

  <script>
    const profiles = [
      { name: "Alex", age: 29, pronouns: "she/her" },
      { name: "Jordan", age: 27, pronouns: "they/them" },
      { name: "Mina", age: 31, pronouns: "she/they" },
      { name: "Sam", age: 26, pronouns: "he/they" }
    ];

    let index = 0;
    let likes = 0;
    let passes = 0;
    let matches = 0;

    const mainCard = document.getElementById("mainCard");
    const emptyState = document.getElementById("emptyState");
    const likesCount = document.getElementById("likesCount");
    const passesCount = document.getElementById("passesCount");
    const matchesCount = document.getElementById("matchesCount");
    const passBtn = document.getElementById("passBtn");
    const likeBtn = document.getElementById("likeBtn");
    const editBtn = document.getElementById("editBtn");
    const profileEditor = document.getElementById("profileEditor");
    const nameInput = document.getElementById("nameInput");
    const ageInput = document.getElementById("ageInput");
    const pronounsInput = document.getElementById("pronounsInput");
    const saveProfileBtn = document.getElementById("saveProfileBtn");
    const addProfileBtn = document.getElementById("addProfileBtn");
    const resetDeckBtn = document.getElementById("resetDeckBtn");
    const chatBox = document.getElementById("chatBox");

    function updateStats() {
      likesCount.textContent = likes;
      passesCount.textContent = passes;
      matchesCount.textContent = matches;
    }

    function renderCard() {
      if (index >= profiles.length) {
        mainCard.innerHTML = "";
        emptyState.style.display = "flex";
        passBtn.disabled = true;
        likeBtn.disabled = true;
        return;
      }

      emptyState.style.display = "none";
      passBtn.disabled = false;
      likeBtn.disabled = false;

      const p = profiles[index];
      mainCard.innerHTML = `
        <div class="photo">${p.name[0]}</div>
        <div class="meta">
          <h2>${p.name}, ${p.age}</h2>
          <p>${p.pronouns}</p>
        </div>
      `;
    }

    function nextCard() {
      index++;
      renderCard();
    }

    passBtn.addEventListener("click", () => {
      passes++;
      updateStats();
      nextCard();
    });

    likeBtn.addEventListener("click", () => {
      likes++;
      if (index % 2 === 0) {
        matches++;
        chatBox.classList.add("show");
      }
      updateStats();
      nextCard();
    });

    editBtn.addEventListener("click", () => {
      profileEditor.classList.toggle("show");
      nameInput.value = "You";
      ageInput.value = 25;
      pronounsInput.value = "she/they";
    });

    saveProfileBtn.addEventListener("click", () => {
      const myProfile = {
        name: nameInput.value || "You",
        age: ageInput.value || 25,
        pronouns: pronounsInput.value || "they/them"
      };
      profiles.unshift(myProfile);
      index = 0;
      profileEditor.classList.remove("show");
      renderCard();
    });

    addProfileBtn.addEventListener("click", () => {
      profileEditor.classList.add("show");
    });

    resetDeckBtn.addEventListener("click", () => {
      index = 0;
      chatBox.classList.remove("show");
      renderCard();
    });

    updateStats();
    renderCard();
  </script>
</body>
</html>
