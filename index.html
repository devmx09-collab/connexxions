<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pride Match</title>
  <style>
    :root{
      --bg:#121014;
      --panel:#1b1820;
      --panel-2:#23202a;
      --text:#f5f2f7;
      --muted:#b9b2c2;
      --accent:#ff4fa3;
      --accent-2:#8b5cf6;
      --danger:#6b7280;
      --ring: rgba(255,79,163,.22);
      --good:#22c55e;
      --bad:#ef4444;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(139,92,246,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255,79,163,.12), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .app {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 1.15rem;
    }

    .gear {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: var(--text);
      font-size: 18px;
    }

    .stack {
      position: relative;
      height: 640px;
    }

    .card {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0)), var(--panel);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.06);
      transition: transform .28s ease, opacity .28s ease;
      will-change: transform, opacity;
    }

    .card.next {
      transform: translateY(10px) scale(.97);
      opacity: .7;
      z-index: 0;
    }

    .card.main {
      z-index: 1;
      cursor: grab;
    }

    .card.main.dragging {
      transition: none;
      cursor: grabbing;
    }

    .photo {
      width: 100%;
      height: 72%;
      object-fit: cover;
      display: block;
      background: #2a2631;
      user-select: none;
      pointer-events: none;
    }

    .content {
      padding: 14px 16px 18px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.12) 20%), var(--panel);
      height: 28%;
    }

    .name-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name {
      font-size: 1.3rem;
      font-weight: 750;
    }

    .distance {
      color: #8fd3ff;
      font-size: .92rem;
      white-space: nowrap;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag {
      font-size: .78rem;
      color: #f1e7ff;
      background: rgba(139,92,246,.18);
      border: 1px solid rgba(139,92,246,.25);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .bio {
      color: var(--muted);
      line-height: 1.35;
      font-size: .95rem;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 2px;
    }

    .btn {
      width: 62px;
      height: 62px;
      border: 0;
      border-radius: 50%;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.22);
    }

    .btn.no { background: var(--danger); color: white; }
    .btn.yes { background: var(--accent); color: white; }

    .nav {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      padding: 12px 8px;
      backdrop-filter: blur(10px);
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .78rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 56px;
    }

    .nav a.active { color: var(--text); }
    .icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
    }

    .header-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 4px;
    }

    .overlay {
      position: absolute;
      top: 18px;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 1rem;
      border: 2px solid currentColor;
      opacity: 0;
      transform: rotate(-12deg);
      transition: opacity .15s ease;
      pointer-events: none;
      z-index: 2;
    }
    .overlay.like { right: 18px; color: var(--good); }
    .overlay.nope { left: 18px; color: var(--bad); }

    .match-banner {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .match-banner.show { opacity: 1; pointer-events: auto; }
    .match-card {
      width: min(92vw, 360px);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04)), var(--panel-2);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }
    .match-card h2 { margin: 0 0 8px; }
    .match-card p { margin: 0 0 16px; color: var(--muted); }
    .match-card button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      .stack { height: 610px; }
      .content { height: 30%; }
      .photo { height: 70%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">Pride Match</div>
      <button class="gear" aria-label="Settings">⚙</button>
    </div>

    <p class="header-note">A queer-first dating space centered on trans and LGBTQ+ connection.</p>

    <section class="stack" aria-label="Profile cards">
      <article class="card next" id="nextCard">
        <img class="photo" id="nextPhoto" src="" alt="Next profile preview">
      </article>

      <article class="card main" id="mainCard">
        <div class="overlay nope" id="nopeOverlay">NOPE</div>
        <div class="overlay like" id="likeOverlay">LIKE</div>
        <img class="photo" id="mainPhoto" src="" alt="Profile photo">
        <div class="content">
          <div class="name-row">
            <div class="name" id="mainName"></div>
            <div class="distance" id="mainDistance"></div>
          </div>

          <div class="tags" id="mainTags"></div>

          <div class="bio" id="mainBio"></div>

          <div class="actions" style="margin-top:14px;">
            <button class="btn no" id="passBtn" aria-label="Pass">✕</button>
            <button class="btn yes" id="likeBtn" aria-label="Like">♥</button>
          </div>
        </div>
      </article>
    </section>

    <nav class="nav" aria-label="Bottom navigation">
      <a class="active" href="#"><span class="icon">👤</span>Profile</a>
      <a href="#"><span class="icon">💬</span>Chat</a>
      <a href="#"><span class="icon">🔎</span>Search</a>
      <a href="#"><span class="icon">❤</span>Likes</a>
      <a href="#"><span class="icon">💝</span>Donate</a>
    </nav>
  </main>

  <div class="match-banner" id="matchBanner" aria-hidden="true">
    <div class="match-card">
      <h2>It’s a match ✨</h2>
      <p>You both liked each other.</p>
      <button id="closeMatch">Keep swiping</button>
    </div>
  </div>

  <script>
    const profiles = [
      {
        name: "Alex, 29",
        distance: "📍 8 mi",
        photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=1200&q=80",
        tags: ["she/her", "trans woman", "bi", "music • cafes • art"],
        bio: "Sweet, nerdy, and into late-night playlists, ramen dates, and silly flirting. Looking for real chemistry and kind energy."
      },
      {
        name: "Jordan, 27",
        distance: "📍 4 mi",
        photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=80",
        tags: ["they/them", "nonbinary", "queer", "books • hiking • film"],
        bio: "Big on softness, good banter, and slow-burn connections. Coffee, bookstores, and nature walks are my happy place."
      },
      {
        name: "Mina, 31",
        distance: "📍 12 mi",
        photo: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=1200&q=80",
        tags: ["she/they", "lesbian", "design", "karaoke • food • travel"],
        bio: "Design nerd with chaotic karaoke energy. I love bold style, kind people, and trying every dumpling place in town."
      }
    ];

    let index = 0;
    let startX = 0;
    let currentX = 0;
    let dragging = false;
    let action = null;

    const mainCard = document.getElementById("mainCard");
    const nextCard = document.getElementById("nextCard");
    const mainPhoto = document.getElementById("mainPhoto");
    const nextPhoto = document.getElementById("nextPhoto");
    const mainName = document.getElementById("mainName");
    const mainDistance = document.getElementById("mainDistance");
    const mainTags = document.getElementById("mainTags");
    const mainBio = document.getElementById("mainBio");
    const passBtn = document.getElementById("passBtn");
    const likeBtn = document.getElementById("likeBtn");
    const nopeOverlay = document.getElementById("nopeOverlay");
    const likeOverlay = document.getElementById("likeOverlay");
    const matchBanner = document.getElementById("matchBanner");
    const closeMatch = document.getElementById("closeMatch");

    function renderCard() {
      const p = profiles[index % profiles.length];
      const n = profiles[(index + 1) % profiles.length];

      mainPhoto.src = p.photo;
      mainName.textContent = p.name;
      mainDistance.textContent = p.distance;
      mainBio.textContent = p.bio;
      mainTags.innerHTML = p.tags.map(t => `<span class="tag">${t}</span>`).join("");

      nextPhoto.src = n.photo;

      resetCard();
    }

    function resetCard() {
      mainCard.style.transform = "translateX(0px) rotate(0deg)";
      mainCard.style.opacity = "1";
      nopeOverlay.style.opacity = "0";
      likeOverlay.style.opacity = "0";
      mainCard.classList.remove("dragging");
      action = null;
    }

    function swipe(direction) {
      const width = window.innerWidth;
      const offX = direction === "like" ? width : -width;
      const rot = direction === "like" ? 18 : -18;

      mainCard.style.transition = "transform .25s ease, opacity .25s ease";
      mainCard.style.transform = `translateX(${offX}px) rotate(${rot}deg)`;
      mainCard.style.opacity = "0";

      setTimeout(() => {
        if (direction === "like" && index === 0) {
          showMatch();
        }
        index = (index + 1) % profiles.length;
        renderCard();
      }, 220);
    }

    function showMatch() {
      matchBanner.classList.add("show");
      matchBanner.setAttribute("aria-hidden", "false");
    }

    function hideMatch() {
      matchBanner.classList.remove("show");
      matchBanner.setAttribute("aria-hidden", "true");
    }

    mainCard.addEventListener("pointerdown", (e) => {
      dragging = true;
      startX = e.clientX;
      currentX = 0;
      mainCard.classList.add("dragging");
      mainCard.setPointerCapture(e.pointerId);
    });

    mainCard.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      currentX = e.clientX - startX;
      const rot = currentX / 18;
      mainCard.style.transform = `translateX(${currentX}px) rotate(${rot}deg)`;
      const opacity = Math.min(Math.abs(currentX) / 120, 1);

      if (currentX > 0) {
        likeOverlay.style.opacity = opacity;
        nopeOverlay.style.opacity = "0";
      } else {
        nopeOverlay.style.opacity = opacity;
        likeOverlay.style.opacity = "0";
      }
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      mainCard.classList.remove("dragging");

      if (Math.abs(currentX) > 110) {
        swipe(currentX > 0 ? "like" : "pass");
      } else {
        resetCard();
      }
    }

    mainCard.addEventListener("pointerup", endDrag);
    mainCard.addEventListener("pointercancel", endDrag);
    passBtn.addEventListener("click", () => swipe("pass"));
    likeBtn.addEventListener("click", () => swipe("like"));
    closeMatch.addEventListener("click", hideMatch);
    matchBanner.addEventListener("click", (e) => {
      if (e.target === matchBanner) hideMatch();
    });

    renderCard();
  </script>
</body>
</html>
